<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- frame: neutral gray, distinct from both strokes -->
  <rect x="4" y="4" width="24" height="24" rx="6" fill="none" stroke="#9aa0ad" stroke-width="1.5"/>
  <!-- \ drawn first (orange) -->
  <line x1="9" y1="9" x2="23" y2="23" stroke="#ffb454" stroke-width="4" stroke-linecap="round"/>
  <!-- / drawn after (blue): opaque overdraw makes it read as "in front" on a transparent bg -->
  <line x1="23" y1="9" x2="9" y2="23" stroke="#5aa9ff" stroke-width="4" stroke-linecap="round"/>
</svg>
